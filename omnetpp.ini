[General-01]
network = VideoStreamingShowcase
scheduler-class = "inet::RealTimeScheduler"

**.crcMode = "computed"
**.fcsMode = "computed"

*.host1.eth[0].typename = "ExtUpperEthernetInterface"
*.host1.eth[0].device = "tapa"
*.host1.eth[0].copyConfiguration = "copyFromExt"

*.host2.eth[0].typename = "ExtUpperEthernetInterface"
*.host2.eth[0].device = "tapb"
*.host2.eth[0].copyConfiguration = "copyFromExt"

*.configurator.config = xml("<config> \
                                <interface hosts='router' names='eth0' address='192.168.2.99' netmask='255.255.255.0'/> \
                                <interface hosts='router' names='eth1' address='192.168.3.99' netmask='255.255.255.0'/> \
                             </config>")
*.router.ipv4.natTable.config = xml("<config> \
                                        <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.2.99\"' \
                                        srcAddress='192.168.3.99' destAddress='192.168.3.20'/> \
                                       <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.3.99\"' \
                                        srcAddress='192.168.2.99' destAddress='192.168.2.20'/> \
                                     </config>")

*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.interfaceTableVisualizer.nodeFilter = "not name=~switch*"

**.duplexMode = true
**.eth*.bitrate = 100Mbps


#-----------------------------------------------------------------------------

[General-02]
description = "(PER = 0.01 e Delay=50ms)"
extends = General-01

**.switch2.ethg*[*].channel.per=0.01 
**.switch2.ethg*[*].channel.delay=50ms

[General-03]
description = "(PER = 0.5 e Delay=50ms)"
extends = General-01

**.switch2.ethg*[*].channel.per=0.5
**.switch2.ethg*[*].channel.delay=10ms

[General-04]
description = "(PER = 0.01 e delay=300ms)"
extends = General-01

**.switch2.ethg*[*].channel.per=0.01 
**.switch2.ethg*[*].channel.delay=300ms

[General-05]
description = "(PER = 0.5 e delay= 300ms)"
extends = General-01

**.switch2.ethg*[*].channel.per=0.5 
**.switch2.ethg*[*].channel.delay=300ms

[General]

scheduler-class = "inet::RealTimeScheduler"

**.debug = true
**.verbose = true
**.trace = true
**.recordEventlog = true

**.crcMode = "computed"
**.fcsMode = "computed"

*.tapa.useServiceDiscovery = true
*.tapb.useServiceDiscovery = true

*.host1.eth[0].typename = "ExtUpperEthernetInterface"
*.host1.eth[0].device = "tapa"
*.host1.eth[0].copyConfiguration = "copyFromExt"

*.host2.eth[0].typename = "ExtUpperEthernetInterface"
*.host2.eth[0].device = "tapb"
*.host2.eth[0].copyConfiguration = "copyFromExt"





                             
*.router.ipv4.natTable.config = xml("<config> \
                                        <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.2.99\"' \
                                        srcAddress='192.168.4.99' destAddress='192.168.4.98'/> \
                                        <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.4.99\"' \
                                        srcAddress='192.168.2.99' destAddress='192.168.2.20'/> \
                                     </config>")

*.routerMobile.ipv4.natTable.config = xml("<config> \
                                        <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.4.98\"' \
                                        srcAddress='192.168.3.99' destAddress='192.168.3.20'/> \
                                        <entry type='prerouting' \
                                        packetFilter='has(Ipv4Header) &amp;&amp; Ipv4Header.protocolId != 1 &amp;&amp; Ipv4Header.destAddress.str() == \"192.168.3.99\"' \
                                        srcAddress='192.168.4.98' destAddress='192.168.4.99'/> \
                                     </config>")
                                     
